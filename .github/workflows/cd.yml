name: Continuous Delivery

on:
  push:
    tags: ['v*']  # push events to matching v*, i.e. v1.0, v20.15.10

env:
  CD: "true"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PYTHON_DEFAULT_VERSION: "3.12"
  UV_VERSION: "0.13.4"

jobs:
  release-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
      vulnerability-alerts: read  # GitHub workflow-syntax permissions: Dependabot alert access.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fetch the release branch ancestry
        run: |
          git fetch --no-tags origin master:refs/remotes/origin/master
          git fetch --no-tags --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - name: Verify maintainer-signed tag
        run: scripts/verify-release-tag.sh "$GITHUB_REF_NAME"
      - name: Check security findings
        env:
          GH_TOKEN: ${{ secrets.RELEASE_SECURITY_TOKEN || github.token }}
          RELEASE_SECURITY_TOKEN: ${{ secrets.RELEASE_SECURITY_TOKEN }}
          SECURITY_GATE_STRICT: ${{ vars.SECURITY_GATE_STRICT || 'false' }}
          RELEASE_FIXES_ADVISORIES: ${{ vars.RELEASE_FIXES_ADVISORIES }}
        run: scripts/release-security-gate.sh
  deploy:
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.build.outputs.version }}
      prerelease: ${{ steps.prerelease_check.outputs.prerelease }}
      # publish_docker: ${{ steps.prerelease_check.outputs.prerelease == 'false' && secrets.DOCKERHUB_USERNAME != '' }}  # doesn't work, hence the workaround
      publish_docker: ${{ steps.prerelease_check.outputs.publish_docker }}
    steps:
      - name: Determine if pre-release
        id: prerelease_check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          is_prerelease=false
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc|dev)[0-9]+$ ]]; then is_prerelease=true; fi
          echo "prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"
          publish_docker=false
          if [[ "$is_prerelease" == false && -n "$DOCKERHUB_USERNAME" ]]; then publish_docker=true; fi
          echo "publish_docker=$publish_docker" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ env.PYTHON_DEFAULT_VERSION }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --locked --group nox
      - name: Build the distribution
        id: build
        run: uv run nox -vs build
      - name: Save Python distributions for Trusted Publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
      - name: Read release notes
        run: scripts/release-notes.sh "${{ steps.build.outputs.version }}" > release-notes.md
      - name: Create GitHub release and upload the distribution
        env:
          VERSION: ${{ steps.build.outputs.version }}
          PRERELEASE: ${{ steps.prerelease_check.outputs.prerelease }}
        run: |
          release_args=()
          if [ "$PRERELEASE" = true ]; then release_args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "$VERSION" --notes-file release-notes.md "${release_args[@]}"
  deploy-pypi:
    needs: deploy
    if: ${{ needs.deploy.outputs.prerelease == 'false' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/b2
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true
  deploy-linux-bundle:
    needs: deploy
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHON_DEFAULT_VERSION: "3.10"  # Use Ubuntu 22.04's distro Python for staticx.
      UV_PYTHON_DOWNLOADS: "never"
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-22.04", "ubuntu-22.04-arm" ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install python${{ env.PYTHON_DEFAULT_VERSION }}-dev python${{ env.PYTHON_DEFAULT_VERSION }}-venv patchelf scons
          uv sync --python /usr/bin/python${{ env.PYTHON_DEFAULT_VERSION }} --locked --group nox
          git config --global --add safe.directory '*'
      - name: Bundle the distribution
        id: bundle
        run: uv run nox -vs bundle
      - name: Sign the bundle
        id: sign
        run: uv run nox -vs sign
      - name: Generate hashes
        id: hashes
        run: uv run nox -vs make_dist_digest
      - name: Upload the bundle to the GitHub release
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
  deploy-windows-bundle:
    needs: deploy
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SM_HOST: ${{ secrets.SM_HOST }}
      SM_API_KEY: ${{ secrets.SM_API_KEY }}
      SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
      SM_CLIENT_CERT_PASSWORD: ${{ secrets. SM_CLIENT_CERT_PASSWORD }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ env.PYTHON_DEFAULT_VERSION }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --locked --group nox
      - name: Bundle the distribution
        id: bundle
        shell: bash
        run: uv run nox -vs bundle
      - name: Install client for code signing with Software Trust Manager
        uses: digicert/ssm-code-signing@9476ceec3ea1c63298d4403b983e1ccf2556ff4c # v1.1.0
        env:
          FORCE_DOWNLOAD_TOOLS: 'true'
      - name: Set up client authentication certificate
        id: client_cert
        run: |
          echo "${{ env.SM_CLIENT_CERT_FILE_B64 }}" | base64 --decode > /d/Certificate_pkcs12.p12
          echo "SM_CLIENT_CERT_FILE=D:\\Certificate_pkcs12.p12" >> "$GITHUB_ENV"
        shell: bash
      - name: Sign the bundle using a keypair alias
        id: sign
        run: uv run nox -vs sign -- '${{ secrets.SM_KEYPAIR_ALIAS }}' '${{ secrets.SM_CERT_FINGERPRINT }}'
      - name: Generate hashes
        id: hashes
        run: uv run nox -vs make_dist_digest
      - name: Upload the bundle to the GitHub release
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
  deploy-docker:
    needs: deploy
    if: ${{ needs.deploy.outputs.publish_docker == 'true' }}
    runs-on: ubuntu-latest
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ env.PYTHON_DEFAULT_VERSION }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync --locked --group nox
      - name: Build Dockerfile
        run: uv run nox -vs generate_dockerfile
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Prepare Docker tags
        id: docker_tags_prep
        env:
          VERSION: ${{ needs.deploy.outputs.version }}
          PRERELEASE: ${{ needs.deploy.outputs.prerelease }}
        run: |
          docker_tags="backblazeit/b2:$VERSION"
          if [ "$PRERELEASE" != true ]; then
            docker_tags="$docker_tags,backblazeit/b2:latest"
          fi
          echo "docker_tags=$docker_tags" >> "$GITHUB_OUTPUT"
      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.docker_tags_prep.outputs.docker_tags }}
          platforms: linux/amd64,linux/arm64
      - name: Update Docker Hub Description
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          login=$(jq -n --arg username "$DOCKERHUB_USERNAME" --arg password "$DOCKERHUB_TOKEN" '{username: $username, password: $password}' \
            | curl --fail --silent --show-error --request POST --header 'Content-Type: application/json' --data-binary @- https://hub.docker.com/v2/users/login)
          token=$(jq -er .token <<< "$login")
          jq -n --arg short 'Official Backblaze B2 CLI docker image' --rawfile full README.md \
            '{description: $short, full_description: $full}' \
            | curl --fail --silent --show-error --output /dev/null --request PATCH \
                --header 'Content-Type: application/json' --header "Authorization: JWT $token" \
                --data-binary @- https://hub.docker.com/v2/repositories/backblazeit/b2
