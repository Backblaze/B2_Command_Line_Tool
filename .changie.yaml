changesDir: .changes
unreleasedDir: unreleased
headerPath: header.tpl.md
changelogPath: CHANGELOG.md
versionExt: md
versionFormat: '## [{{.VersionNoPrefix}}](https://github.com/Backblaze/B2_Command_Line_Tool/releases/tag/{{.Version}}) - {{.Time.Format "2006-01-02"}}'
kindFormat: '### {{.Kind}}'
# Preserve the existing repository sentence policy (not a B2 API restriction):
# https://github.com/Backblaze/B2_Command_Line_Tool/blob/9194ec532616c4a2044b0e78b08c84fd8e86e386/noxfile.py#L853-L877
changeFormat: >-
  {{- if not (regexMatch `^\p{Lu}` .Body) -}}
  {{- fail "Changelog body must start with a capital letter." -}}
  {{- end -}}
  {{- if not (hasSuffix "." (trim .Body)) -}}
  {{- fail "Changelog body must end with a full stop." -}}
  {{- end -}}
  - {{.Body}}
kinds:
  - label: Removed
    auto: major
  - label: Changed
    auto: minor
  - label: Fixed
    auto: patch
  - label: Deprecated
    auto: minor
  - label: Added
    auto: minor
  - label: Doc
    auto: patch
  - label: Infrastructure
    auto: patch
newlines:
  afterChangelogHeader: 0
  beforeChangelogVersion: 1
  endOfVersion: 1
  afterKind: 1
  beforeKind: 1
